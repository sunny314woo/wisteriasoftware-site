<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Cancelled</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    .wrap {
      max-width: 680px;
      margin: 80px auto;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 10px 0;
      line-height: 1.6;
      color: #4b5563;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="font-size:40px; margin-bottom:12px;">⚠️</div>
      <h1>Payment Cancelled</h1>
      <p>Your checkout was not completed.</p>
      <p>No charge has been made.</p>
      <a class="btn" href="https://wisteriasoftware.uk/outline-pro.html">Back to Product Page</a>
    </div>
  </div>
</body>
</html>
